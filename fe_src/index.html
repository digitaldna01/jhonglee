<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>jhonglee</title>
    <!-- Apply persisted theme before first paint to avoid a flash.
         Default is light; prefers-color-scheme is deliberately not consulted. -->
    <script>(function(){try{var t=localStorage.getItem('pf-theme');
      document.documentElement.setAttribute('data-theme',(t==='light'||t==='dark')?t:'light');
    }catch(e){}})();</script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!-- <link rel="icon" type="image/svg+xml" href="/vite.svg" /> -->
    <!-- Browser tab favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />

    <!-- Apple iOS -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Android/Chrome -->
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/android-chrome-192x192.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/android-chrome-512x512.png"
    />

    <!-- Optional manifest for PWA -->
    <link rel="manifest" href="/site.webmanifest" />
  </head>

    <div id="root"></div>

  </body>
</html>
