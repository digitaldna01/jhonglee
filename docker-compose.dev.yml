# Local development WITH hot reload — NOT used on the Raspberry Pi.
# Frontend runs the Vite dev server (HMR); backend runs uvicorn --reload
# against Postgres+pgvector and Redis. Source is bind-mounted, so edits
# reload live without rebuilding.
#
#   docker compose -f docker-compose.dev.yml up --build
#
# Open http://localhost:5173. Re-run with --build only after changing
# dependencies (package-lock.json / requirements.txt). Migrations run on
# every backend *start* (entrypoint) — uvicorn's code reload does not re-run
# them, so after adding a migration: `docker compose -f docker-compose.dev.yml restart backend`.
# To write a new one:
#   docker compose -f docker-compose.dev.yml exec backend alembic revision --autogenerate -m "..."
# The RAG index syncs on every start too (only changed chunks are re-embedded);
# by hand: `docker compose -f docker-compose.dev.yml exec backend python -m app.chat.ingest`
#
# For production-parity (nginx serving the static build + /api proxy), use
# docker-compose.local.yml instead.
name: jhonglee-dev

services:
  web:
    build:
      context: ./fe_src
      dockerfile: Dockerfile.dev
    container_name: jhonglee-web-dev
    environment:
      # Vite proxies /api to the backend container, not localhost.
      - VITE_API_PROXY=http://backend:8000
      # macOS Docker bind mounts need polling for HMR to detect edits.
      - VITE_USE_POLLING=1
    volumes:
      - ./fe_src:/app          # live source
      - /app/node_modules      # keep the image's linux node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

  backend:
    build: ./be_src
    container_name: jhonglee-backend-dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - CORS_ORIGINS=http://localhost:5173
      # macOS Docker bind mounts need polling for --reload to detect edits.
      - WATCHFILES_FORCE_POLLING=true
      # optional: real chat answers in dev (put it in a local .env)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - DATABASE_URL=postgresql+asyncpg://jhonglee:${POSTGRES_PASSWORD:-jhonglee}@db:5432/jhonglee
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./be_src/app:/app/app                # live source
      - ./be_src/migrations:/app/migrations  # so new revisions land in the repo
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg17
    container_name: jhonglee-db-dev
    environment:
      - POSTGRES_USER=jhonglee
      - POSTGRES_DB=jhonglee
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-jhonglee}
    ports:
      - "5433:5432"
    volumes:
      - db-data-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jhonglee -d jhonglee"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: jhonglee-redis-dev
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru --save "" --appendonly no
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data-dev:
