name: Deploy jhonglee.com

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: deploy-jhonglee
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # The web bundle is built natively here (x86) — building it inside the
      # arm64 image under QEMU took >17 minutes; the image step below only
      # copies dist/ into nginx (fe_src/Dockerfile.deploy).
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fe_src/package-lock.json

      - name: Build web bundle (and the corpus both images embed)
        working-directory: fe_src
        run: |
          npm ci
          npm run corpus   # writes fe_src/src/landing/data/corpus.gen.json + be_src/app/content/corpus.json
          npm run build

      # LSA demo artifacts (~24 MB of numpy arrays + SQLite snippets) are fit
      # here on x86 — scikit-learn under QEMU would be slow, and serving only
      # needs the saved arrays. Cached on the script's hash: the fit is
      # deterministic, so a cache hit skips the ~2 min rebuild entirely.
      - name: Cache LSA demo artifacts
        id: lsa-cache
        uses: actions/cache@v4
        with:
          path: be_src/app/demos/lsa/artifacts
          key: lsa-artifacts-${{ hashFiles('be_src/scripts/build_lsa_demo.py') }}

      - name: Build LSA demo artifacts
        if: steps.lsa-cache.outputs.cache-hit != 'true'
        working-directory: be_src
        run: |
          pip install --quiet numpy scikit-learn
          python scripts/build_lsa_demo.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: ./fe_src
          file: ./fe_src/Dockerfile.deploy
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=min

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./be_src
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/jhonglee-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=min

  deploy-on-pi:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # actions/checkout runs `git clean -ffdx`, which deletes any .env left in
      # the checkout — so runtime secrets come from repository secrets and are
      # written fresh on every deploy (Settings → Secrets and variables → Actions).
      # OWNER_TOKEN is the site owner's login (POST /api/auth/owner); optional.
      # POSTGRES_PASSWORD must never change after the first deploy: the
      # database volume keeps the password it was initialised with.
      - name: Write runtime secrets
        run: |
          umask 077
          printf 'ANTHROPIC_API_KEY=%s\nPOSTGRES_PASSWORD=%s\nOWNER_TOKEN=%s\n' \
            "${{ secrets.ANTHROPIC_API_KEY }}" "${{ secrets.POSTGRES_PASSWORD }}" "${{ secrets.OWNER_TOKEN }}" > .env

      - name: Pull and restart containers
        run: |
          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -f
