name: Deploy jhonglee.com

on:
  push:
    branches: ["vite"] # 배포 트리거 브랜치

concurrency:
  group: deploy-jhonglee
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: self-hosted # ✅ Pi 러너에서 실행

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install & Build
        run: |
          npm ci
          npm run build

      - name: Sanity check build output
        run: |
          test -f dist/index.html

      - name: List dist (for debugging)
        if: always()
        run: ls -lah dist || true

      - name: Deploy to Nginx root
        run: |
          mkdir -p /var/www/jhonglee.com
          rsync -a --delete dist/ /var/www/jhonglee.com/
          sudo systemctl reload nginx || sudo systemctl restart nginx

      - name: Post-deploy health check
        run: |
          curl -fsS --resolve jhonglee.com:443:127.0.0.1 https://jhonglee.com >/dev/null
