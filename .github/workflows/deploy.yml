name: Deploy jhonglee.com

on:
  push:
    branches: ["vite"] # 배포 트리거 브랜치 이름

concurrency:
  group: deploy-jhonglee # 중복 실행 방지
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: self-hosted # ✅ Pi 러너에서 실행

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install & Build
        run: |
          npm ci
          npm run build

      # (선택) 빌드 산출물 확인
      - name: List dist
        run: ls -lah dist || true

      - name: Deploy to Nginx root
        run: |
          mkdir -p /var/www/jhonglee.com
          # 안전 배포: 임시 디렉토리에 복사 후 원자적 교체
          rsync -a --delete dist/ /var/www/jhonglee.com/
          sudo systemctl reload nginx || sudo systemctl restart nginx
