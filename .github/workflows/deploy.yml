name: Deploy jhonglee.com

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: deploy-jhonglee
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: ./fe_src
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=min

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./be_src
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/jhonglee-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=min

  deploy-on-pi:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # actions/checkout runs `git clean -ffdx`, which deletes any .env left in
      # the checkout — so runtime secrets come from repository secrets and are
      # written fresh on every deploy (Settings → Secrets and variables → Actions).
      # POSTGRES_PASSWORD must never change after the first deploy: the
      # database volume keeps the password it was initialised with.
      - name: Write runtime secrets
        run: |
          umask 077
          printf 'ANTHROPIC_API_KEY=%s\nPOSTGRES_PASSWORD=%s\n' \
            "${{ secrets.ANTHROPIC_API_KEY }}" "${{ secrets.POSTGRES_PASSWORD }}" > .env

      - name: Pull and restart containers
        run: |
          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -f
