# Production on the Raspberry Pi (arm64). Images are built by CI and pulled
# from GHCR; db/redis are official multi-arch images. Secrets come from a
# .env file next to this compose file on the Pi:
#
#   ANTHROPIC_API_KEY=...     (optional — without it chat is retrieval-only)
#   POSTGRES_PASSWORD=...     (required)
#
# Memory: the Pi is a 2 GB Pi 4 (free -h: 1.8Gi). Budget per container below
# (mem_limit). These limits only work once memory cgroups are enabled on the
# Pi — add `cgroup_enable=cpuset cgroup_enable=memory cgroup_memory=1` to
# /boot/firmware/cmdline.txt and reboot (until then `docker stats` shows 0B).
# Also raise swap to 1 GB (dphys-swapfile) to absorb the startup embedding peak.
#   backend  ≈ 1.0–1.1 GB (onnxruntime + multilingual int8 model)  limit 1.3 GB
#   postgres ≈ 30 MB idle                              limit 256 MB
#   redis    ≤ 48 MB data                              limit 96 MB
#   web      ≈ 10 MB                                   limit 64 MB
services:
  web:
    image: ghcr.io/digitaldna01/jhonglee:latest
    container_name: jhonglee-web
    ports:
      - "8080:80"
    restart: unless-stopped
    mem_limit: 64m
    depends_on:
      - backend

  backend:
    image: ghcr.io/digitaldna01/jhonglee-backend:latest
    container_name: jhonglee-backend
    restart: unless-stopped
    mem_limit: 1300m
    environment:
      - CORS_ORIGINS=https://jhonglee.com
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - DATABASE_URL=postgresql+asyncpg://jhonglee:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/jhonglee
      - REDIS_URL=redis://redis:6379/0
      - OWNER_TOKEN=${OWNER_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg17
    container_name: jhonglee-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=jhonglee
      - POSTGRES_DB=jhonglee
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    mem_limit: 256m
    # 2 GB-node tuning: a few dozen vectors and a handful of tables need almost
    # nothing. Raise shared_buffers / max_connections if the corpus grows large.
    command: >
      postgres
      -c shared_buffers=32MB
      -c effective_cache_size=128MB
      -c work_mem=2MB
      -c maintenance_work_mem=16MB
      -c max_connections=10
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jhonglee -d jhonglee"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: jhonglee-redis
    restart: unless-stopped
    mem_limit: 96m
    # Ephemeral state only (chat sessions, counters) → hard memory cap with
    # LRU eviction; light snapshotting so sessions survive a restart.
    command: >
      redis-server
      --maxmemory 48mb
      --maxmemory-policy allkeys-lru
      --save 300 1
      --appendonly no
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
  redis-data:
