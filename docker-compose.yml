services:
  web:
    image: ghcr.io/digitaldna01/jhonglee:latest
    container_name: jhonglee-web
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    image: ghcr.io/digitaldna01/jhonglee-backend:latest
    container_name: jhonglee-backend
    restart: unless-stopped
    environment:
      - CORS_ORIGINS=https://jhonglee.com
      # set in a .env file next to this compose file on the Pi;
      # without it the chat degrades to retrieval-only answers
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # SQLite lives on a named volume so it survives image updates
      - DATABASE_URL=sqlite+aiosqlite:////app/data/app.db
    volumes:
      - backend-data:/app/data

volumes:
  backend-data:
